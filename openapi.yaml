openapi: 3.1.0
info:
  title: 人生有迹免费卡片 API
  version: 0.8.2
  description: >-
    API负责出生时间处理、确定性排盘、私有分析、20年连续人生K线、当前课题和PNG卡片渲染。
    一次性体验码在准备阶段被预占，成功返回PNG后永久核销；未出图的失败允许重试。
servers:
  - url: https://rensheng-youji-ap-454189475786.asia-east1.run.app
security:
  - ExperienceCode: []
paths:
  /generate:
    post:
      operationId: prepareBirthCard
      summary: 准备新版免费卡片
      description: 校正出生时间、排盘，准备人生K线与当前课题，并预占一次性体验码，不永久核销。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BirthRequest'
      responses:
        '200':
          description: 出生事实、私有服务结果与警告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /render-card:
    post:
      operationId: renderBirthCard
      summary: 生成并核销免费卡片
      description: 使用同一组出生信息生成PNG；只有PNG成功生成后才永久核销体验码。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BirthRequest'
      responses:
        '200':
          description: 1242×1660 PNG卡片；体验码已核销
          content:
            image/png:
              schema:
                type: string
                contentEncoding: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 体验码并发冲突或已被其他成功请求核销
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
components:
  securitySchemes:
    ExperienceCode:
      type: apiKey
      in: header
      name: X-API-Key
      description: 一次性个人体验码；不要写入公开文件或日志。
  responses:
    Unauthorized:
      description: 体验码缺失、无效、已过期或已使用
    InvalidInput:
      description: 出生信息、时间口径或地点校验失败
    TemporarilyUnavailable:
      description: 服务或验证码存储暂时不可用；未成功出图时可使用原码重试
  schemas:
    BirthRequest:
      type: object
      required: [birth, city, gender]
      properties:
        name:
          type: string
          maxLength: 50
          default: ''
          description: 姓名可选
        birth:
          type: string
          pattern: '^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}$'
          example: '1999-01-22 17:45'
        city:
          type: string
          example: 北京
        country:
          type: string
          default: 中国
        gender:
          type: string
          enum: [male, female]
        time_basis:
          type: string
          enum: [local_civil, true_solar_adjusted]
          default: local_civil
        timezone:
          type: [string, 'null']
          description: 未收录地点可提供IANA时区，例如Asia/Shanghai
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
    GenerateResponse:
      type: object
      additionalProperties: true
      properties:
        version:
          type: string
        name:
          type: string
        birthplace:
          type: string
        time:
          type: object
          additionalProperties: true
        bazi:
          type: object
          additionalProperties: true
        card_copy:
          type: object
          additionalProperties: true
          description: 由私有服务生成；调用方不得自行改写后再提交
        life_kline:
          type: object
          additionalProperties: true
          description: 由私有服务生成的20年连续人生K线、阶段标签与当前课题；调用方不得自行重算
        warnings:
          type: array
          items:
            type: string
        disclaimer:
          type: string
