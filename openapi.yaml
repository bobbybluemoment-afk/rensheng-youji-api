openapi: 3.1.0
info:
  title: 人生有迹 API
  version: 0.6.0
  description: >-
    API负责确定性排盘、固定内容匹配、私有方法文案生成与卡片渲染；
    调用方模型只负责收集输入和展示结果。
servers:
  - url: https://rensheng-youji-ap-454189475786.asia-east1.run.app
security:
  - ApiKeyAuth: []
paths:
  /generate:
    post:
      operationId: prepareBirthCard
      summary: 排盘并生成免费卡片文案
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BirthRequest'
      responses:
        '200':
          description: 四柱、日柱固定角色、初始天赋和服务器生成的卡片文案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /render-card:
    post:
      operationId: renderBirthCard
      summary: 使用私有方法文案渲染卡片
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BirthRequest'
      responses:
        '200':
          description: 1242×1660 PNG卡片
          content:
            image/png:
              schema:
                type: string
                contentEncoding: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidInput'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  responses:
    Unauthorized:
      description: API Key缺失或无效
    InvalidInput:
      description: 输入、时间口径、城市或文案版式校验失败
  schemas:
    BirthRequest:
      type: object
      required: [birth, city, gender]
      properties:
        name:
          type: string
          maxLength: 50
          default: ''
          description: 姓名可选；不填时卡片自动收起姓名行
        birth:
          type: string
          pattern: '^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}$'
          example: '1999-01-22 17:45'
        city:
          type: string
          example: 泉州
        country:
          type: string
          default: 中国
        gender:
          type: string
          enum: [male, female]
        time_basis:
          type: string
          enum: [local_civil, true_solar_adjusted]
          default: local_civil
        timezone:
          type: [string, 'null']
          description: 未收录城市提供IANA时区，例如Asia/Shanghai
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
    GenerateResponse:
      type: object
      required: [version, gender, birthplace, time, bazi, profile, card_copy, warnings, disclaimer]
      properties:
        version:
          type: string
        name:
          type: string
        gender:
          type: string
        birthplace:
          type: string
        time:
          type: object
          additionalProperties: true
        bazi:
          type: object
          additionalProperties: true
          description: 包含四柱、日主、大运及analysis_context事实层
        profile:
          type: object
          required: [day_pillar, player_type, talent_description]
          properties:
            day_pillar:
              type: string
            player_type:
              type: string
            talent_description:
              type: string
        card_copy:
          type: object
          required: [core_mystic, core_plain, main_task, quote, quote_source, reading_note]
          description: 由人生有迹私有方法确定性生成；调用方不应自行改写后再提交
          properties:
            core_mystic:
              type: string
            core_plain:
              type: array
              minItems: 1
              maxItems: 2
              items:
                type: string
            main_task:
              type: string
            quote:
              type: string
            quote_source:
              type: string
            reading_note:
              type: string
        warnings:
          type: array
          items:
            type: string
        disclaimer:
          type: string
