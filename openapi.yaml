openapi: 3.1.0
info:
  title: 人生有迹 API
  version: 0.3.0
  description: >-
    调用方自己的模型生成人生有迹卡片文案；API负责确定性排盘、
    单个日柱固定内容匹配、字段校验和私有卡片渲染。
servers:
  - url: https://rensheng-youji-ap-454189475786.asia-east1.run.app
security:
  - ApiKeyAuth: []
paths:
  /generate:
    post:
      operationId: prepareBirthCard
      summary: 排盘并准备写作事实层
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BirthRequest'
      responses:
        '200':
          description: 四柱、日柱固定角色、初始天赋和全盘事实层
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /render-card:
    post:
      operationId: renderBirthCard
      summary: 校验调用方模型文案并渲染卡片
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderRequest'
      responses:
        '200':
          description: 1242×1660 PNG卡片
          content:
            image/png:
              schema:
                type: string
                contentEncoding: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidInput'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  responses:
    Unauthorized:
      description: API Key缺失或无效
    InvalidInput:
      description: 输入、时间口径、城市或文案版式校验失败
  schemas:
    BirthRequest:
      type: object
      required: [birth, city, gender]
      properties:
        name:
          type: string
          maxLength: 50
          default: ''
          description: 姓名可选；不填时卡片自动收起姓名行
        birth:
          type: string
          pattern: '^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}$'
          example: '1999-01-22 17:45'
        city:
          type: string
          example: 泉州
        country:
          type: string
          default: 中国
        gender:
          type: string
          enum: [male, female]
        time_basis:
          type: string
          enum: [local_civil, true_solar_adjusted]
          default: local_civil
        timezone:
          type: [string, 'null']
          description: 未收录城市提供IANA时区，例如Asia/Shanghai
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
    GenerateResponse:
      type: object
      required: [version, gender, birthplace, time, bazi, profile, warnings, disclaimer]
      properties:
        version:
          type: string
        name:
          type: string
        gender:
          type: string
        birthplace:
          type: string
        time:
          type: object
          additionalProperties: true
        bazi:
          type: object
          additionalProperties: true
          description: 包含四柱、日主、大运及analysis_context事实层
        profile:
          type: object
          required: [day_pillar, player_type, talent_description]
          properties:
            day_pillar:
              type: string
            player_type:
              type: string
            talent_description:
              type: string
        warnings:
          type: array
          items:
            type: string
        disclaimer:
          type: string
    RenderRequest:
      allOf:
        - $ref: '#/components/schemas/BirthRequest'
        - type: object
          required: [core_mystic, core_plain, main_task, quote, quote_source]
          properties:
            core_mystic:
              type: string
              minLength: 8
              maxLength: 90
              description: 一句命理事实，包含月令、根气、透干及一至两个关键关系
            core_plain:
              type: array
              minItems: 1
              maxItems: 2
              items:
                type: string
                maxLength: 34
            main_task:
              type: string
              minLength: 20
              maxLength: 36
              description: 20—36个汉字，并应能在卡片中单行显示
            quote:
              type: string
              minLength: 10
              maxLength: 30
              description: 已联网核对的真实古诗文或经典原句
            quote_source:
              type: string
              minLength: 2
              maxLength: 50
              description: 准确篇名和出处

