interface:
  display_name: "人生有迹完整报告"
  short_description: "经五题校准、人物写作和中文编辑生成10页报告"
  default_prompt: "使用 $rensheng-youji-deep-report，先只询问我的出生时间、出生城市、性别和关注问题，再从固定互斥题型中选择五道最有命理校准价值的问题；学历、职业、关系与家庭状态均为可选。先由Core完成原局、根苗花果、资源关系、盲派交叉层和岁运连续分析，再将Core判断、机制、证据与限制实体化，经过人物初稿和独立中文编辑，生成新版人生卡片和固定10页报告。校准只修正现实候选，不得主导人生主线和六个领域；不要展示校准结果、内部命理术语、证据或程序过程。"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
